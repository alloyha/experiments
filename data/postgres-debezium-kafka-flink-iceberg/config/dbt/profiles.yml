################################################################################
# CDC Analytics - dbt Profiles Configuration
# 
# Medalhão Pattern (Lakehouse):
#   Bronze (RAW)     → Flink ingests to Iceberg
#   Silver (CLEAN)   → Flink transforms in Iceberg  
#   Gold (BUSINESS)  → PostgreSQL materialized tables for analytics
#   Diamond (SEMANTIC) → PostgreSQL OBT cubes for BI tools
#
################################################################################

cdc_analytics:
  outputs:
    # ────────────────────────────────────────────────────────────────────────
    # 🔵 BRONZE & 🟡 SILVER: Streaming Ingestão & Transformação (Iceberg)
    # ────────────────────────────────────────────────────────────────────────
    # Usado para:
    # - Capturar dados brutos do CDC (Bronze)
    # - Limpar, enriquecer e deduplica dados (Silver)
    # - Armazenar em Iceberg para query em batch/streaming
    # - Lakehouse completo: dados sempre recuperáveis
    #
    flink:
      type: flink
      host: flink-sql-gateway
      port: 8084
      database: iceberg
      schema: bronze
      session_name: cdc_ingestao
      threads: 4
      
    # ────────────────────────────────────────────────────────────────────────
    # 📊 GOLD & 💎 DIAMOND: Business Analytics (PostgreSQL)
    # ────────────────────────────────────────────────────────────────────────
    # Usado para:
    # - Materializar dados transformados finais (Gold layer)
    # - Tabelas de fato e dimensão para BI/dataviz
    # - OBT cubes e agregações semânticas (Diamond layer)
    # - Queries OLAP rápidas com índices
    # - Fácil integração com Grafana, Metabase, Superset, Looker, Tableau
    #
    postgres:
      type: postgres
      host: postgres
      user: postgres
      password: postgres
      port: 5432
      dbname: analytics_db
      schema: gold
      threads: 4
      keepalives_idle: 0

    # ────────────────────────────────────────────────────────────────────────
    # 📊 GOLD: DuckDB lendo Iceberg (Silver) diretamente do MinIO
    # ────────────────────────────────────────────────────────────────────────
    # Usado para:
    # - Ler slv_customers/slv_orders do Iceberg (fonte confiavel) via o
    #   plugin nativo "iceberg" do dbt-duckdb (pyiceberg SqlCatalog contra o
    #   MESMO catalogo JDBC/Postgres que o Flink usa), sem passar pelo
    #   Postgres OLTP. Ver models/gold/_sources.yml (source iceberg_silver).
    # - Materializar Gold diretamente no Postgres (banco anexado via
    #   DuckDB attach), para o Diamond (target postgres) continuar
    #   referenciando as mesmas tabelas com ref() normalmente.
    #
    duckdb:
      type: duckdb
      path: /tmp/medalhao.duckdb
      schema: gold
      # threads: 1 -- multiple models concurrently touching the same
      # plugin-loaded Iceberg source race on DuckDB's catalog ("Catalog
      # write-write conflict on create with <namespace>"); serialize instead.
      threads: 1
      extensions:
        - httpfs
      plugins:
        - module: iceberg
          alias: iceberg
          config:
            catalog: iceberg_catalog
            type: sql
            uri: "postgresql+psycopg2://postgres:postgres@postgres:5432/iceberg_catalog"
            warehouse: "s3://iceberg-warehouse/"
            s3.endpoint: "http://minio:9000"
            s3.access-key-id: minioadmin
            s3.secret-access-key: minioadmin
            s3.path-style-access: "true"
      attach:
        - path: "dbname=analytics_db host=postgres user=postgres password=postgres"
          type: postgres
          alias: pg

  # ############################################################################
  # TARGET PADRÃO: flink (ingestão contínua Bronze → Silver em Iceberg)
  # Gold (le Iceberg, escreve Postgres): dbt run -t duckdb -s gold
  # Diamond (le Postgres, escreve Postgres): dbt run -t postgres -s diamond
  # ############################################################################
  target: flink



