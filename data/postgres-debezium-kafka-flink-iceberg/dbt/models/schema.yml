version: 2

sources:
  - name: kafka_cdc
    description: "CDC data from Kafka topics (Debezium)"
    database: iceberg
    schema: raw
    tables:
      - name: customers
        description: "Customer data captured via Debezium from PostgreSQL"
        columns:
          - name: id
            description: "Customer ID"
            data_type: int
          - name: name
            description: "Customer name"
            data_type: string
          - name: email
            description: "Customer email"
            data_type: string
          - name: phone
            description: "Customer phone"
            data_type: string
          - name: country
            description: "Customer country"
            data_type: string
          - name: created_at
            description: "Creation timestamp"
            data_type: timestamp
          - name: updated_at
            description: "Update timestamp"
            data_type: timestamp
          - name: __deleted
            description: "Debezium deleted flag"
            data_type: boolean

      - name: orders
        description: "Order data captured via Debezium from PostgreSQL"
        columns:
          - name: id
            description: "Order ID"
            data_type: int
          - name: customer_id
            description: "Foreign key to customer"
            data_type: int
          - name: order_date
            description: "Order date"
            data_type: timestamp
          - name: total_amount
            description: "Order total"
            data_type: decimal
          - name: status
            description: "Order status"
            data_type: string
          - name: created_at
            description: "Creation timestamp"
            data_type: timestamp
          - name: updated_at
            description: "Update timestamp"
            data_type: timestamp
          - name: __deleted
            description: "Debezium deleted flag"
            data_type: boolean
