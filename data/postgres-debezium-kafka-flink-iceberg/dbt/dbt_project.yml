

# Name your project! Project names should be lowercase and use underscores as spaces.
name: 'cdc_analytics'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'cdc_analytics'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

on-run-start:
  - "{{ setup_flink_bronze_sources() }}"

# Flink-specific configurations
vars:
  kafka_broker: "kafka:29092"
  iceberg_warehouse: "s3://iceberg-warehouse"
  minio_endpoint: "http://minio:9000"
  minio_access_key: "minioadmin"
  minio_secret_key: "minioadmin"
  s3_path_style_access: true

seeds:
  cdc_analytics:
    +database: "iceberg"
    +schema: "raw"

# ============================================================================
# MODEL CONFIGURATION BY LAYER
#
# Medalhão Pattern (Lakehouse):
#   🔵 Bronze:  Raw CDC data          → Flink/Iceberg (Streaming)
#   🟡 Silver:  Cleaned & enriched    → Flink/Iceberg (Streaming)  
#   📊 Gold:    Business-ready tables → PostgreSQL (OLAP)
#   💎 Diamond: Semantic OLAP cubes   → PostgreSQL (BI tools)
# ============================================================================

models:
  cdc_analytics:
    materialized: table
    
    # 🔵 BRONZE: Raw CDC data (streaming via Flink)
    bronze:
      +materialized: table
      +target: flink
      +schema: bronze
      
    # 🟡 SILVER: Cleaned & deduplicated (streaming via Flink)
    silver:
      +materialized: table
      +target: flink
      +schema: silver
      
    # 📊 GOLD: Business-ready analytics tables, read from Iceberg (Silver) via
    # DuckDB, materialized into the attached PostgreSQL. Run with: dbt run -t duckdb -s gold
    gold:
      +materialized: table
      +target: duckdb
      +schema: gold


    # 💎 DIAMOND: Semantic layer (OBT OLAP cubes)
    diamond:
      +materialized: table
      +target: postgres
      +schema: diamond
      +post_hook: >
        {%- if execute -%}
          {% set index_cols = config.get('indexes', []) %}
          {% for idx in index_cols %}
            CREATE INDEX IF NOT EXISTS idx_{{ this.name }}_{{ idx.columns[0] }}
            ON {{ this.schema }}.{{ this.name }}({{ idx.columns|join(',') }});
          {% endfor %}
        {%- endif -%}

