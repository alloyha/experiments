[project]
name = "postgres-debezium-kafka-flink-iceberg"
version = "0.1.0"
description = "CDC Stack with PostgreSQL, Debezium, Kafka, Flink, and Iceberg"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Bruno Peixoto", email = "brunolnetto@gmail.com"}
]
keywords = ["cdc", "data-pipeline", "kafka", "flink", "iceberg", "dbt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Core dependencies used across multiple components
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# Data generator: generates synthetic data for PostgreSQL
data-generator = [
    "psycopg2-binary>=2.9.9",
    "names>=0.3.0",
    "python-dotenv>=1.0.0",
]

# DBT Flink: Kafka CDC to Iceberg streaming ingestion (Bronze -> Silver)
dbt-flink = [
    "dbt-flink-adapter>=1.3.11",
    "python-dotenv>=1.0.0",
]

# DBT DuckDB: Analytics queries on Iceberg tables (Silver -> Gold)
dbt-duckdb = [
    "dbt-duckdb>=1.5.0",
    "dbt-postgres>=1.7.0",
    "python-dotenv>=1.0.0",
    "pyiceberg[sql-postgres]>=0.5.1",
    "pyarrow>=14.0.0",
    "s3fs>=2023.12.0",
]

# DBT Runner: Core dbt CLI with PostgreSQL adapter
dbt-runner = [
    "dbt-core>=1.7.0",
    "dbt-postgres>=1.7.0",
    "python-dotenv>=1.0.0",
]

# Flink Consumer: Kafka to Iceberg streaming consumer
flink-consumer = [
    "kafka-python>=2.0.2",
    "pyiceberg>=0.4.0",
]

# Full stack: all components
full = [
    # dbt ecosystems
    "dbt-core>=1.7.0",
    "dbt-flink>=1.7.0",
    "dbt-flink-adapter>=1.3.11",
    "dbt-duckdb>=1.5.0",
    "dbt-postgres>=1.7.0",
    
    # Data processing & lakehouse
    "pyiceberg>=0.5.1",
    "pyspark>=3.4.0",
    "pandas>=2.0.0",
    "s3fs>=2023.12.0",
    
    # Streaming & messaging
    "kafka-python>=2.0.2",
    
    # Database drivers
    "psycopg2-binary>=2.9.9",
    
    # Utilities
    "requests>=2.31.0",
    "names>=0.3.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

# Development dependencies
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/alloyha/experiments"
Documentation = "https://github.com/alloyha/experiments/tree/main/data/postgres-debezium-kafka-flink-iceberg"
Repository = "https://github.com/alloyha/experiments.git"
Issues = "https://github.com/alloyha/experiments/issues"

[tool.uv]
# UV configuration for fast dependency resolution and installation
dev-dependencies = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=. --cov-report=html"
python_files = ["test_*.py", "*_test.py"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.git
  | \.venv
  | build
  | dist
  | \.eggs
  | \.pytest_cache
  | \.mypy_cache
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    ".eggs",
    ".pytest_cache",
    ".mypy_cache",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
