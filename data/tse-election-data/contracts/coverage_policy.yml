# CCC v1: closed-world public decision policy.
# Technical layers are explicitly internal by architecture, never public by accident.
# Every Gold/Semantic model must receive a named, reviewed decision.
version: 1
internal_defaults:
  bronze: Raw-facing normalization is an implementation layer, never a stable consumer interface.
  silver: Staging and intermediate transformations are private to the analytical DAG.
  physical: Physical publication is governed by GG fencing and separate certificates, not ODCS.
  seed: Repository-owned dbt fixture and reference seeds are not externally published interfaces.
  source: Upstream input source declarations do not promise a consumer-facing Gold contract.
resources:
  model:dim_election_cycle:
    visibility: public
    contract: dim_election_cycle
    grain: [election_year, election_type]
    semantic_test: dbt_utils.unique_combination_of_columns
  model:dim_election:
    visibility: public
    contract: dim_election
    grain: [election_year, election_type, election_code]
    semantic_test: dbt_utils.unique_combination_of_columns

# Source-reviewed CCC v1.2 decisions. Consumer exposure must be re-reviewed if usage changes.
  model:candidate_result_coverage:
    visibility: internal
    reason: Distinct availability keys derived from fact_candidate_votes solely to scope candidate-versus-tally quality checks.
  model:candidate_tally_coverage_gaps:
    visibility: internal
    reason: Diagnostic of tally slices without candidate-result coverage; it reports missing evidence rather than an official vote measure.
  model:candidate_tally_reconciliation:
    visibility: internal
    reason: Internal comparison of candidate nominal votes with tally only on covered slices; not a supported analytical serving table.
  model:party_tally_coverage_gaps:
    visibility: internal
    reason: Diagnostic of party-source coverage and converted-vote overlap; discrepancies must remain explicit in quality assessment.
  model:party_tally_reconciliation:
    visibility: internal
    reason: Internal party-versus-tally measure reconciliation; validation requires its own data assertions and coverage-gap context.
  model:graph_edges:
    visibility: internal
    reason: Expensive live graph edge projection, not an immutable publication; graph correctness and certification remain GG-controlled.
  model:graph_vertices:
    visibility: internal
    reason: Expensive live graph vertex projection, not a persistent certified snapshot; graph correctness remains GG-controlled.
  model:dim_candidate:
    visibility: public
    contract: dim_candidate
    grain: [election_year, election_type, election_code, candidate_id]
    semantic_test: dbt_utils.unique_combination_of_columns
  model:dim_geography:
    visibility: public
    contract: dim_geography
    grain: [election_year, election_type, uf, municipality_code]
    semantic_test: dbt_utils.unique_combination_of_columns
  model:dim_party:
    visibility: public
    contract: dim_party
    grain: [election_year, election_type, election_code, party_number]
    semantic_test: dbt_utils.unique_combination_of_columns
  model:fact_electorate_municipality:
    visibility: public
    contract: fact_electorate_municipality
    grain: [election_year, election_type, uf, municipality_code]
    semantic_test: dbt_utils.unique_combination_of_columns
  model:fact_party_votes:
    visibility: public
    contract: fact_party_votes
    grain: [election_year, election_type, election_code, round_number, uf, municipality_code, zone, office_code, party_number, is_transit_vote]
    semantic_test: dbt_utils.unique_combination_of_columns
  model:fact_tally_munzona:
    visibility: public
    contract: fact_tally_munzona
    grain: [election_year, election_type, election_code, round_number, uf, municipality_code, zone, office_code, is_transit_vote]
    semantic_test: dbt_utils.unique_combination_of_columns

  model:fact_turnout:
    visibility: public
    contract: fact_turnout
    grain: [election_year, election_type, election_code, round_number, uf, municipality_code, zone, office_code, is_transit_vote]
    semantic_test: dbt_utils.unique_combination_of_columns

  model:fact_candidate_votes:
    visibility: public
    contract: fact_candidate_votes
    grain: [election_year, election_type, election_code, round_number, uf, municipality_code, zone, office_code, candidate_id, is_transit_vote]
    semantic_test: dbt_utils.unique_combination_of_columns

# CCC D1: source-reviewed private semantic interfaces.
  model:candidate_ranking:
    visibility: internal
    reason: Ranking of observed nominal votes, not certified elected status; kept private until ranking completeness and consumer semantics are certified.
  model:candidate_summary:
    visibility: internal
    reason: Descriptive aggregation of candidatures and declared assets without a certified population coverage or cross-cycle comparability policy.
  model:candidate_vote_summary:
    visibility: internal
    reason: Candidate vote aggregation with zone-count geography semantics requiring review before stable consumer publication.
  model:election_results:
    visibility: internal
    reason: Top-ranked and runner-up candidate projection does not establish official election outcomes or elected status.
  model:electoral_participation:
    visibility: internal
    reason: Direct projection of the published fact_turnout model; independent consumer publication would duplicate its existing contract.
  model:party_performance:
    visibility: internal
    reason: Cross-source analytical reconciliation with potentially incomplete coverage and repeated event-office denominators; not a certified serving interface.

  model:obt_electorate_municipality:
    visibility: public
    contract: obt_electorate_municipality
    grain: [cycle_id, uf, municipality_code]
    semantic_test: dbt_utils.unique_combination_of_columns

  model:cube_participation_municipality:
    visibility: public
    contract: cube_participation_municipality
    grain: [election_id, round_number, uf, municipality_code, office_code, is_transit_vote]
    semantic_test: dbt_utils.unique_combination_of_columns

  model:cube_party_performance_municipality:
    visibility: public
    contract: cube_party_performance_municipality
    grain: [election_id, round_number, uf, municipality_code, office_code, is_transit_vote, party_number]
    semantic_test: dbt_utils.unique_combination_of_columns

  model:cube_candidate_performance_municipality:
    visibility: public
    contract: cube_candidate_performance_municipality
    grain: [election_id, round_number, uf, municipality_code, office_code, is_transit_vote, candidate_id]
    semantic_test: dbt_utils.unique_combination_of_columns
