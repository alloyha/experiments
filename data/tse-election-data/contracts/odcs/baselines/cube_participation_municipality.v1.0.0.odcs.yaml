apiVersion: v3.2.0
kind: DataContract
id: urn:datacontract:tse:semantic:cube_participation_municipality
name: cube_participation_municipality
version: 1.0.0
status: active
description:
  purpose: Municipal turnout snapshot at election-event, round, UF, municipality, office and transit-vote grain.
    Zone-level records are aggregated before optional geographic enrichment. Eligible voters, turnout and abstentions
    must not be added across offices, rounds or overlapping election events without an explicit selection policy.
    Rates use positive eligible-voter denominators only. This contract does not certify upstream completeness or
    physical GG publication.
