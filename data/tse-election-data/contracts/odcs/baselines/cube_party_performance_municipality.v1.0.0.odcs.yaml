apiVersion: v3.2.0
kind: DataContract
id: urn:datacontract:tse:semantic:cube_party_performance_municipality
name: cube_party_performance_municipality
version: 1.0.0
status: active
description:
  purpose: Municipal party-vote analytical snapshot at election-event, round, UF, municipality, office, transit-vote
    and party grain. Zone-level votes are aggregated before dimension enrichment. Nominal and legend votes have
    distinct meanings; total_legend_valid_votes includes converted-to-legend components and must not be added again
    to party_valid_votes. Party share uses observed party-valid votes in the same event, round, office, municipality
    and transit slice. Ranking reflects observed party votes, not official election outcomes. The interface does
    not certify source completeness or GG publication.
schema:
- name: cube_party_performance_municipality
  description: Municipal party-vote analytical snapshot at election-event, round, UF, municipality, office, transit-vote
    and party grain. Zone-level votes are aggregated before dimension enrichment. Nominal and legend votes have
    distinct meanings; total_legend_valid_votes includes converted-to-legend components and must not be added again
    to party_valid_votes. Party share uses observed party-valid votes in the same event, round, office, municipality
    and transit slice. Ranking reflects observed party votes, not official election outcomes. The interface does
    not certify source completeness or GG publication.
  properties:
