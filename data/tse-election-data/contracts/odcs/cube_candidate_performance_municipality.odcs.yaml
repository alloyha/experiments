apiVersion: v3.2.0
kind: DataContract
id: urn:datacontract:tse:semantic:cube_candidate_performance_municipality
name: cube_candidate_performance_municipality
version: 1.0.0
status: active
description:
  purpose: Municipal candidate-vote analytical snapshot at election-event, round, UF, municipality, office, transit-vote
    and candidate grain. Zone-level valid nominal votes are aggregated before optional candidate and geography enrichment.
    Candidate rank reflects only observed nominal votes and does not establish officially elected status. Candidate
    vote share uses the sum of observed candidate nominal valid votes in the same municipal contest slice, only
    when the denominator is positive. History represents derived election snapshots, not SCD2. Source completeness,
    official results and physical GG publication are not certified by this contract.
