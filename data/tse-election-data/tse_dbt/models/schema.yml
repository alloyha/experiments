        - election_type
        - election_code
        - candidate_id
  columns:
  - name: election_year
    tests:
    - not_null
  - name: election_type
    tests:
    - not_null
  - name: election_id
    tests:
    - not_null
  - name: election_code
    tests:
    - not_null
  - name: candidate_id
    tests:
    - not_null
- name: fact_electorate_municipality
  description: Electorate aggregated at municipality level for each election cycle.
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
