version: 2
seeds:
- name: election_calendar
  description: Canonical regular Brazilian election cycles used by both ingestion and analytics.
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - election_year
        - election_type
  columns:
  - name: election_year
    tests:
    - not_null
  - name: election_type
    tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - general
          - municipal
  - name: election_scope
    tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - federal_state
          - municipal
models:
- name: bronze_candidates
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - election_year
        - election_type
        - election_code
        - candidate_id
  columns:
  - name: election_year
    tests:
    - not_null
  - name: election_type
    tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - general
          - municipal
  - name: election_scope
    tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - federal_state
          - municipal
  - name: office_scope
    tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - federal
          - state
          - municipal
          - other
  - name: candidate_id
    tests:
    - not_null
  - name: candidate_name
    tests:
    - not_null
- name: bronze_candidate_assets
  columns:
  - name: election_year
    tests:
    - not_null
  - name: election_type
    tests:
    - not_null
  - name: candidate_id
    tests:
    - not_null
- name: dim_election
  description: One row per canonical election cycle.
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - election_year
        - election_type
        - election_code
  columns:
  - name: election_id
    tests:
    - not_null
    - unique
  - name: election_type
    tests:
    - accepted_values:
        arguments:
          values:
          - general
          - municipal
- name: dim_candidate
  description: Candidate dimension enriched with election cycle/scope and declared asset aggregates.
