version: 2
models:
- name: fact_turnout
  description: Derived election-event turnout snapshot sourced from fact_tally_munzona.
    The row grain includes year, election type, election event, round, UF, municipality,
    zone, office and transit-vote flag. History uses partition replacement and is
    not append-only or SCD2. Eligible electorate, turnout and abstentions must not
    be summed across overlapping events, rounds or office slices. Rates are defined
    only for positive denominators. This contract does not independently certify upstream
    source completeness or physical GG publication.
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - election_year
        - election_type
        - election_code
        - round_number
        - uf
        - municipality_code
        - zone
        - office_code
        - is_transit_vote
  columns:
  - name: election_type
    data_type: varchar
    description: General or municipal election.
  - name: election_scope
    data_type: varchar
    description: Observed election scope.
  - name: election_id
    data_type: varchar
    description: Election-event identity; not a unique row key.
  - name: election_code
    data_type: varchar
    description: Election-event code within the cycle.
  - name: uf
    data_type: varchar
    description: Federal unit of the observation.
  - name: municipality_code
    data_type: varchar
    description: Municipality within the election cycle and UF.
  - name: office_code
    data_type: varchar
    description: Office or contest. Required to preserve the fact grain.
  - name: office_scope
    data_type: varchar
    description: Observed office scope.
  - name: election_year
    data_type: integer
    description: Election cycle year.
  - name: round_number
    data_type: integer
    description: Election-event round.
  - name: zone
    data_type: integer
    description: Electoral zone.
  - name: is_transit_vote
    data_type: boolean
    description: Whether the record represents transit voting.
  - name: eligible_voters
    data_type: bigint
    description: Eligible electorate in this event, round and office slice.
    tests:
    - not_null
  - name: voters_uninstalled_sections
    data_type: bigint
    description: Voters associated with uninstalled sections.
  - name: uncounted_voters
    data_type: bigint
    description: Derived as eligible_voters minus turnout minus abstentions.
  - name: turnout
    data_type: bigint
    description: Reported turnout at the exact event and office grain.
    tests:
    - not_null
  - name: abstentions
    data_type: bigint
    description: Reported abstentions at the exact event and office grain.
    tests:
    - not_null
  - name: turnout_rate
    data_type: double
    description: Turnout divided by eligible_voters when denominator is positive.
  - name: abstention_rate
    data_type: double
    description: Abstentions divided by eligible_voters when denominator is positive.
  - name: generated_at
    data_type: timestamp
    description: Source or ingestion timestamp.
  - name: cycle_id
    data_type: varchar
    description: Parent election cycle identity; not a unique row key.
    tests:
    - not_null
  config:
    meta:
      datacontract_cli:
        contract_id: urn:datacontract:tse:gold:fact_turnout
