version: 2
models:
- name: fact_candidate_votes
  description: Authoritative candidate-vote snapshot at election-event, round, UF, municipality, zone, office, candidate and transit-vote grain. Historical partitions are snapshots rather than append-only or SCD2 history. Candidate identity is election-specific. The Hive year column is physical partition metadata, not part of the public grain. The contract does not independently certify raw-source completeness, physical GG publication, election results or candidate elected status.
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - election_year
        - election_type
        - election_code
        - round_number
        - uf
        - municipality_code
        - zone
        - office_code
        - candidate_id
        - is_transit_vote
      config:
        tags:
        - expensive
  config:
    meta:
      datacontract_cli:
        contract_id: urn:datacontract:tse:gold:fact_candidate_votes
  columns:
  - name: election_year
    data_type: integer
    description: Election cycle year.
    data_tests:
    - not_null:
        description: Check that field election_year has no missing values
        config:
          meta:
            datacontract_cli:
              include_in_tests: true
              check: fact_candidate_votes__election_year__field_required
              contract_versions:
              - 1.0.0
              generated: false
  - name: election_type
    data_type: varchar
    description: General or municipal election.
    data_tests:
    - not_null:
        description: Check that field election_type has no missing values
        config:
          meta:
            datacontract_cli:
              include_in_tests: true
              check: fact_candidate_votes__election_type__field_required
              contract_versions:
              - 1.0.0
              generated: false
  - name: election_scope
    data_type: varchar
    description: Observed election scope.
  - name: election_id
    data_type: varchar
    description: Election-event identity; not row-unique.
    data_tests:
    - not_null:
        description: Check that field election_id has no missing values
        config:
          meta:
            datacontract_cli:
              include_in_tests: true
              check: fact_candidate_votes__election_id__field_required
              contract_versions:
              - 1.0.0
              generated: false
  - name: election_code
    data_type: varchar
    description: Election-event code within the cycle.
    data_tests:
    - not_null:
        description: Check that field election_code has no missing values
        config:
          meta:
            datacontract_cli:
              include_in_tests: true
              check: fact_candidate_votes__election_code__field_required
              contract_versions:
              - 1.0.0
              generated: false
  - name: round_number
    data_type: integer
    description: Election round.
    data_tests:
    - not_null:
        description: Check that field round_number has no missing values
        config:
          meta:
            datacontract_cli:
              include_in_tests: true
              check: fact_candidate_votes__round_number__field_required
              contract_versions:
              - 1.0.0
              generated: false
  - name: uf
    data_type: varchar
    description: Federal unit.
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: fact_candidate_votes__uf__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field uf has no missing values
  - name: municipality_code
    data_type: varchar
    description: Municipality identifier.
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: fact_candidate_votes__municipality_code__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field municipality_code has no missing values
  - name: zone
    data_type: integer
    description: Electoral zone.
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: fact_candidate_votes__zone__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field zone has no missing values
  - name: office_code
    data_type: varchar
    description: Office or contest identifier.
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: fact_candidate_votes__office_code__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field office_code has no missing values
  - name: office_scope
    data_type: varchar
    description: Observed office scope.
  - name: candidate_id
    data_type: varchar
    description: Election-specific candidate identifier.
    data_tests:
    - not_null:
        description: Check that field candidate_id has no missing values
        config:
          meta:
            datacontract_cli:
              include_in_tests: true
              check: fact_candidate_votes__candidate_id__field_required
              contract_versions:
              - 1.0.0
              generated: false
  - name: totalization_status_code
    data_type: varchar
    description: Observed totalization status code.
  - name: is_transit_vote
    data_type: boolean
    description: Transit-vote indicator.
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: fact_candidate_votes__is_transit_vote__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field is_transit_vote has no missing values
  - name: nominal_votes
    data_type: bigint
    description: Reported candidate nominal votes.
    data_tests:
    - not_null:
        description: Check that field nominal_votes has no missing values
        config:
          meta:
            datacontract_cli:
              include_in_tests: true
              check: fact_candidate_votes__nominal_votes__field_required
              contract_versions:
              - 1.0.0
              generated: false
  - name: nominal_valid_votes
    data_type: bigint
    description: Reported valid nominal candidate votes.
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: fact_candidate_votes__nominal_valid_votes__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field nominal_valid_votes has no missing values
  - name: generated_at
    data_type: timestamp
    description: Source or ingestion generation timestamp.
  - name: source_file
    data_type: varchar
    description: Physical source lineage; not a durable identifier.
  - name: year
    data_type: bigint
    description: Hive partition year; not an additional grain component.
  - name: cycle_id
    data_type: varchar
    description: Parent election cycle identity year:type.
    data_tests:
    - not_null:
        description: Check that field cycle_id has no missing values
        config:
          meta:
            datacontract_cli:
              include_in_tests: true
              check: fact_candidate_votes__cycle_id__field_required
              contract_versions:
              - 1.0.0
              generated: false
