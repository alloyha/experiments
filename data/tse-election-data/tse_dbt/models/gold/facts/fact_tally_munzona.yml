version: 2
models:
- name: fact_tally_munzona
  description: 'Authoritative election-event tally snapshot at year, type, event, round, UF, municipality, zone, office and transit-vote flag grain. Source-aware, partition-replaced history is NOT append-only or SCD2. Do not aggregate electorate or turnout across overlapping election-event, round or office slices. Vote components may overlap: do not infer conservation identities without a separately certified reconciliation. This ODCS surface does not certify candidate-versus-tally coverage or physical publication outside the cooperative gateway.'
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - election_year
        - election_type
        - election_code
        - round_number
        - uf
        - municipality_code
        - zone
        - office_code
        - is_transit_vote
  config:
    meta:
      datacontract_cli:
        contract_id: urn:datacontract:tse:gold:fact_tally_munzona
  columns:
  - name: election_year
    data_type: integer
    description: Year of the election cycle.
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: fact_tally_munzona__election_year__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field election_year has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
  - name: election_type
    data_type: varchar
    description: General or municipal election class.
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: fact_tally_munzona__election_type__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field election_type has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
  - name: election_scope
    data_type: varchar
    description: Observed election scope; not part of the row key.
    config:
      meta:
        datacontract_cli:
          generated: true
  - name: cycle_id
    data_type: varchar
    description: Parent cycle year:type identity, not row-unique.
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: fact_tally_munzona__cycle_id__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field cycle_id has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
  - name: election_id
    data_type: varchar
    description: Election event identity year:type:code, not row-unique.
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: fact_tally_munzona__election_id__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field election_id has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
  - name: election_code
    data_type: varchar
    description: Election event code, scoped within the cycle.
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: fact_tally_munzona__election_code__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field election_code has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
  - name: round_number
    data_type: integer
    description: Round of the election event.
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: fact_tally_munzona__round_number__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field round_number has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
  - name: uf
    data_type: varchar
    description: Federal unit of the tally record.
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: fact_tally_munzona__uf__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field uf has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
  - name: municipality_code
    data_type: varchar
    description: Municipality code, scoped to the election cycle and UF.
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: fact_tally_munzona__municipality_code__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field municipality_code has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
  - name: zone
    data_type: integer
    description: Electoral zone within the municipality.
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: fact_tally_munzona__zone__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field zone has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
  - name: office_code
    data_type: varchar
    description: Office/contest identifier; cannot be omitted from the tally grain.
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: fact_tally_munzona__office_code__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field office_code has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
  - name: office_scope
    data_type: varchar
    description: Reported office scope; not an additional unique key.
    config:
      meta:
        datacontract_cli:
          generated: true
  - name: is_transit_vote
    data_type: boolean
    description: Whether this record belongs to transit voting.
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: fact_tally_munzona__is_transit_vote__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field is_transit_vote has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
  - name: eligible_voters
    data_type: bigint
    description: Eligible electorate as reported in the tally source at this slice.
    config:
      meta:
        datacontract_cli:
          generated: true
  - name: voters_uninstalled_sections
    data_type: bigint
    description: Reported voters associated with uninstalled sections.
    config:
      meta:
        datacontract_cli:
          generated: true
  - name: turnout
    data_type: bigint
