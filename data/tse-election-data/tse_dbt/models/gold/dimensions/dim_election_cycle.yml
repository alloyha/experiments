version: 2
models:
- name: dim_election_cycle
  description: One row for each observed general or municipal election cycle.
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - election_year
        - election_type
  columns:
  - name: cycle_id
    data_type: varchar
    description: Stable year:type identity, e.g. 2024:municipal.
    data_tests:
    - not_null:
        description: Check that field cycle_id has no missing values
        config:
          meta:
            datacontract_cli:
              include_in_tests: true
              check: dim_election_cycle__cycle_id__field_required
              contract_versions:
              - 1.0.0
              generated: false
    - unique:
        description: Check that field cycle_id has no duplicate values
        config:
          meta:
            datacontract_cli:
              include_in_tests: true
              check: dim_election_cycle__cycle_id__field_unique
              contract_versions:
              - 1.0.0
              generated: false
  - name: election_year
    data_type: integer
    description: Gregorian election year.
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: dim_election_cycle__election_year__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field election_year has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
  - name: election_type
    data_type: varchar
    description: Election class, general or municipal.
    data_tests:
    - not_null:
        config:
          meta:
            datacontract_cli:
              check: dim_election_cycle__election_type__field_required
              include_in_tests: true
              contract_versions:
              - 1.0.0
              generated: true
        description: Check that field election_type has no missing values
    config:
      meta:
        datacontract_cli:
          generated: true
  config:
    meta:
      datacontract_cli:
        contract_id: urn:datacontract:tse:gold:dim_election_cycle
