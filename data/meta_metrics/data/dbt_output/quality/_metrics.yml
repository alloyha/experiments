version: 2
metrics:
- name: quality_audit_nonconformity_rate
  label: Taxa de Não Conformidade em Auditoria
  description: Não conformidades encontradas por item ou requisito auditado.
  type: derived
  type_params:
    expr: '# TODO translate: nonconformities / NULLIF(audited_items,0)'
  tags:
  - quality
  meta:
    owners:
    - type: business
      team: Quality
      contact: quality@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: denominator_not_zero_rate
      threshold: '0.99'
      severity: warning
    - dimension: accuracy
      rule: value_in_range_0_to_2
      severity: error
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: '%'
    data_quality: audited
    refresh_frequency: daily
- name: quality_corrective_action_on_time_rate
  label: Ações Corretivas no Prazo
  description: Percentual de ações corretivas concluídas dentro do prazo.
  type: derived
  type_params:
    expr: '# TODO translate: on_time_actions / NULLIF(due_actions,0)'
  tags:
  - quality
  meta:
    owners:
    - type: business
      team: Quality
      contact: quality@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: denominator_not_zero_rate
      threshold: '0.99'
      severity: warning
    - dimension: accuracy
      rule: value_in_range_0_to_2
      severity: error
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: '%'
    data_quality: audited
    refresh_frequency: daily
- name: quality_cost_of_poor_quality
  label: Custo da Má Qualidade
  description: Custo associado a falhas internas, externas, retrabalho e refugo.
  type: derived
  type_params:
    expr: '# TODO translate: SUM(internal_failure_cost + external_failure_cost + rework_cost)'
  tags:
  - quality
  meta:
    owners:
    - type: business
      team: Quality
      contact: quality@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: null_rate
      threshold: '0.01'
      severity: warning
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: BRL
    data_quality: audited
    refresh_frequency: daily
