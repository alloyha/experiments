version: 2
metrics:
- name: marketing_brand_search_share
  label: Participação de Busca de Marca
  description: Participação estimada da demanda de busca associada à marca.
  type: derived
  type_params:
    expr: '# TODO translate: brand_search_volume / NULLIF(total_category_search_volume,0)'
  tags:
  - marketing
  meta:
    owners:
    - type: business
      team: Marketing
      contact: marketing@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: denominator_not_zero_rate
      threshold: '0.99'
      severity: warning
    - dimension: accuracy
      rule: value_in_range_0_to_2
      severity: error
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: '%'
    data_quality: audited
    refresh_frequency: daily
