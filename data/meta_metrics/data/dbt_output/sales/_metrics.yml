    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: null_rate
      threshold: '0.01'
      severity: warning
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: BRL
    data_quality: audited
    refresh_frequency: daily
- name: sales_discount_rate
  label: Taxa Média de Desconto
  description: Desconto médio aplicado sobre o preço de tabela.
  type: derived
  type_params:
    expr: '# TODO translate: SUM(list_price - sold_price) / NULLIF(SUM(list_price),0)'
  tags:
  - sales
  meta:
    owners:
    - type: business
      team: Sales
      contact: sales@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: denominator_not_zero_rate
      threshold: '0.99'
      severity: warning
    - dimension: accuracy
      rule: value_in_range_0_to_2
      severity: error
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: '%'
    data_quality: audited
