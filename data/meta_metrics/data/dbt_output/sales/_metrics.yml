version: 2
metrics:
- name: sales_average_days_to_close_won
  label: Dias Médios até Ganho
  description: Tempo médio entre criação e fechamento ganho.
  type: derived
  type_params:
    expr: '# TODO translate: AVG(days_between(created_at,won_at))'
  tags:
  - sales
  meta:
    owners:
    - type: business
      team: Sales
      contact: sales@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: dias
    data_quality: audited
    refresh_frequency: daily
- name: sales_average_deal_size
  label: Ticket Médio de Venda
  description: Valor médio das oportunidades ganhas.
  type: simple
  type_params:
    measure:
      name: average_deal_size
  tags:
  - sales
  meta:
    owners:
    - type: business
      team: Sales
      contact: sales@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: BRL
    data_quality: audited
    refresh_frequency: daily
- name: sales_average_revenue_per_sales_rep
  label: Receita Média por Vendedor
  description: Receita ganha média atribuída por vendedor.
  type: derived
  type_params:
    expr: '# TODO translate: closed_won_amount / NULLIF(active_sales_reps,0)'
  tags:
  - sales
  meta:
    owners:
    - type: business
      team: Sales
      contact: sales@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: denominator_not_zero_rate
      threshold: '0.99'
      severity: warning
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: BRL
    data_quality: audited
    refresh_frequency: daily
- name: sales_bookings
  label: Bookings
