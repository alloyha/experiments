- name: finance_burn_rate
  label: Burn Rate
  description: Velocidade média de consumo líquido de caixa.
  type: derived
  type_params:
    expr: '# TODO translate: net_cash_outflow / months'
  tags:
  - finance
  meta:
    owners:
    - type: business
