version: 2
metrics:
- name: finance_arpa
  label: Receita Média por Conta (ARPA)
  description: Receita média por conta pagante no período.
  type: derived
  type_params:
    expr: finance_net_revenue / NULLIF(distinct_paying_accounts,0)
    metrics:
    - name: finance_net_revenue
  tags:
  - finance
  meta:
    owners:
    - type: business
      team: Finance
      contact: finance@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: denominator_not_zero_rate
      threshold: '0.99'
      severity: warning
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: BRL
    data_quality: audited
    refresh_frequency: daily
- name: finance_arpu
  label: Receita Média por Usuário (ARPU)
  description: Receita média atribuída por usuário ativo ou pagante no período.
  type: derived
  type_params:
    expr: finance_net_revenue / NULLIF(distinct_paying_users,0)
    metrics:
    - name: finance_net_revenue
  tags:
  - finance
  meta:
