    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: BRL
    data_quality: audited
    refresh_frequency: daily
- name: finance_arr
  label: Receita Recorrente Anualizada (ARR)
  description: MRR anualizado para representar receita recorrente em base anual.
  type: derived
  type_params:
    expr: finance_mrr * 12
    metrics:
    - name: finance_mrr
  tags:
  - finance
  meta:
    owners:
    - type: business
