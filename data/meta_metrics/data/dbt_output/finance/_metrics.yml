      threshold: '0.99'
      severity: warning
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: BRL/mês
    data_quality: audited
    refresh_frequency: daily
- name: finance_cac
  label: Custo de Aquisição de Cliente (CAC)
  description: Investimento de marketing e vendas dividido pelos novos clientes pagantes adquiridos.
