version: 2
metrics:
- name: support_agent_utilization
  label: Utilização de Agente
  description: Proporção do tempo disponível do agente dedicado a trabalho produtivo.
  type: derived
  type_params:
    expr: '# TODO translate: productive_minutes / NULLIF(available_minutes,0)'
  tags:
  - support
  meta:
    owners:
    - type: business
      team: Support
      contact: support@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: denominator_not_zero_rate
      threshold: '0.99'
      severity: warning
    - dimension: accuracy
      rule: value_in_range_0_to_2
      severity: error
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: '%'
    data_quality: audited
    refresh_frequency: daily
- name: support_backlog
  label: Backlog de Suporte
  description: Número de tickets abertos e não resolvidos na referência.
  type: simple
  type_params:
    measure:
      name: backlog
  tags:
  - support
  meta:
    owners:
    - type: business
      team: Support
      contact: support@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: null_rate
      threshold: '0.01'
      severity: warning
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: tickets
    data_quality: audited
    refresh_frequency: daily
