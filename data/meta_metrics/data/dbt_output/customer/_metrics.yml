      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: null_rate
      threshold: '0.01'
      severity: warning
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: BRL
    data_quality: audited
    refresh_frequency: daily
