version: 2
metrics:
- name: customer_churn_rate
  label: Taxa de Churn de Clientes
  description: Percentual de clientes elegíveis no início do período que cancelam.
  type: derived
  type_params:
    expr: '# TODO translate: churned_customers / NULLIF(starting_eligible_customers,0)'
  tags:
  - customer
  meta:
    owners:
    - type: business
      team: Customer
      contact: customer@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: denominator_not_zero_rate
      threshold: '0.99'
      severity: warning
    - dimension: accuracy
      rule: value_in_range_0_to_2
      severity: error
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: '%'
    data_quality: audited
    refresh_frequency: daily
- name: customer_churned_mrr
  label: MRR Perdido por Churn
