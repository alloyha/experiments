      threshold: '0.001'
      severity: error
    unit: BRL
    data_quality: audited
    refresh_frequency: daily
- name: hr_employee_engagement_score
  label: Índice de Engajamento
  description: Pontuação agregada de engajamento obtida por pesquisa definida pela organização.
  type: simple
  type_params:
    measure:
      name: employee_engagement_score
  tags:
  - hr
  meta:
    owners:
    - type: business
      team: Hr
      contact: hr@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: score
