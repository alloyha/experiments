version: 2
metrics:
- name: hr_absenteeism_rate
  label: Taxa de Absenteísmo
  description: Percentual de horas planejadas perdidas por ausência.
  type: derived
  type_params:
    expr: '# TODO translate: absence_hours / NULLIF(scheduled_hours,0)'
  tags:
  - hr
  meta:
    owners:
    - type: business
      team: Hr
      contact: hr@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: denominator_not_zero_rate
      threshold: '0.99'
      severity: warning
    - dimension: accuracy
      rule: value_in_range_0_to_2
      severity: error
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: '%'
    data_quality: audited
    refresh_frequency: daily
- name: hr_cost_per_hire
  label: Custo por Contratação
  description: Custo total de recrutamento dividido pelas contratações realizadas.
  type: derived
  type_params:
    expr: '# TODO translate: recruiting_cost / NULLIF(new_hires,0)'
  tags:
  - hr
  meta:
