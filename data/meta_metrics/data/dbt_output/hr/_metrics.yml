- name: hr_headcount
  label: Headcount
  description: Número de colaboradores ativos na data de referência.
  type: simple
  type_params:
    measure:
      name: headcount
  tags:
  - hr
  meta:
    owners:
    - type: business
      team: Hr
      contact: hr@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: null_rate
      threshold: '0.01'
      severity: warning
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: pessoas
    data_quality: audited
    refresh_frequency: daily
- name: hr_headcount_growth_rate
  label: Crescimento de Headcount
  description: Variação percentual do headcount em relação ao período comparável.
  type: derived
  type_params:
    expr: '# TODO translate: (headcount - prior_headcount) / NULLIF(prior_headcount,0)'
  tags:
  - hr
  meta:
    owners:
    - type: business
      team: Hr
      contact: hr@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: denominator_not_zero_rate
      threshold: '0.99'
      severity: warning
    - dimension: accuracy
      rule: value_in_range_0_to_2
      severity: error
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: '%'
    data_quality: audited
    refresh_frequency: daily
