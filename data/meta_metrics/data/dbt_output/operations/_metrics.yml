version: 2
metrics:
- name: operations_capacity_utilization
  label: Utilização de Capacidade
  description: Uso efetivo da capacidade disponível.
  type: derived
  type_params:
    expr: '# TODO translate: used_capacity / NULLIF(available_capacity,0)'
  tags:
  - operations
  meta:
    owners:
    - type: business
      team: Operations
      contact: operations@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: denominator_not_zero_rate
      threshold: '0.99'
      severity: warning
    - dimension: accuracy
      rule: value_in_range_0_to_2
      severity: error
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: '%'
    data_quality: audited
    refresh_frequency: daily
- name: operations_cost_per_unit
