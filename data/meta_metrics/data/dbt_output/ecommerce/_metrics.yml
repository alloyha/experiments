version: 2
metrics:
- name: ecommerce_average_order_value
  label: Ticket Médio (AOV)
  description: Receita líquida média por pedido.
  type: derived
  type_params:
    expr: '# TODO translate: net_sales / NULLIF(orders,0)'
  tags:
  - ecommerce
  meta:
    owners:
    - type: business
      team: Ecommerce
      contact: ecommerce@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: denominator_not_zero_rate
      threshold: '0.99'
      severity: warning
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: BRL
    data_quality: audited
    refresh_frequency: daily
- name: ecommerce_cart_abandonment_rate
