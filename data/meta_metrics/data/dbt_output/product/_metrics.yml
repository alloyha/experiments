version: 2
metrics:
- name: product_activation_rate
  label: Taxa de Ativação
  description: Percentual de novos usuários que atingem o evento de valor definido.
  type: derived
  type_params:
    expr: '# TODO translate: activated_users / NULLIF(new_users,0)'
  tags:
  - product
  meta:
    owners:
    - type: business
      team: Product
      contact: product@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: denominator_not_zero_rate
      threshold: '0.99'
      severity: warning
    - dimension: accuracy
      rule: value_in_range_0_to_2
      severity: error
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: '%'
    data_quality: audited
    refresh_frequency: daily
- name: product_avg_session_duration
  label: Duração Média da Sessão
  description: Duração média das sessões de usuários.
  type: simple
  type_params:
    measure:
      name: avg_session_duration
  tags:
  - product
  meta:
    owners:
    - type: business
      team: Product
      contact: product@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: segundos
    data_quality: audited
    refresh_frequency: daily
- name: product_dau
  label: Usuários Ativos Diários (DAU)
  description: Número de usuários únicos que executaram uma ação ativa no dia.
  type: derived
  type_params:
    expr: '# TODO translate: COUNT(DISTINCT active_user_id)'
  tags:
  - product
  meta:
    owners:
    - type: business
      team: Product
      contact: product@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: null_rate
      threshold: '0.01'
      severity: warning
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: usuários
    data_quality: audited
    refresh_frequency: daily
- name: product_dau_mau_ratio
  label: Razão DAU/MAU (Stickiness)
  description: Razão entre usuários ativos diários e mensais.
  type: derived
  type_params:
    expr: AVG(product_dau) / NULLIF(product_mau,0)
    metrics:
    - name: product_dau
    - name: product_mau
  tags:
  - product
  meta:
    owners:
    - type: business
      team: Product
      contact: product@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: denominator_not_zero_rate
      threshold: '0.99'
      severity: warning
    - dimension: accuracy
      rule: value_in_range_0_to_2
      severity: error
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: '%'
    data_quality: audited
    refresh_frequency: daily
