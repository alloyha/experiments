version: 2
metrics:
- name: strategy_customer_count
  label: Clientes Ativos
  description: Número de clientes ativos na referência.
  type: simple
  type_params:
    measure:
      name: customer_count
  tags:
  - strategy
  meta:
    owners:
    - type: business
      team: Strategy
      contact: strategy@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: null_rate
      threshold: '0.01'
      severity: warning
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: clientes
    data_quality: audited
    refresh_frequency: daily
- name: strategy_customer_growth_rate
  label: Crescimento de Clientes
  description: Variação percentual da base de clientes em relação ao período comparável.
  type: derived
  type_params:
    expr: '# TODO translate: (customers-prior_customers)/NULLIF(prior_customers,0)'
  tags:
  - strategy
  meta:
    owners:
    - type: business
      team: Strategy
      contact: strategy@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: denominator_not_zero_rate
      threshold: '0.99'
      severity: warning
    - dimension: accuracy
      rule: value_in_range_0_to_2
      severity: error
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: '%'
    data_quality: audited
    refresh_frequency: daily
- name: strategy_market_share
  label: Participação de Mercado
  description: Receita ou volume da empresa dividido pelo mercado relevante definido.
