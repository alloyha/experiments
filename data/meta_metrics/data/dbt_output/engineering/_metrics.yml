version: 2
metrics:
- name: engineering_change_fail_rate
  label: Taxa de Falha de Mudança
  description: Percentual de deployments que causam falha em produção e exigem intervenção.
  type: derived
  type_params:
    expr: '# TODO translate: failed_deployments / NULLIF(deployments,0)'
  tags:
  - engineering
  meta:
    owners:
    - type: business
      team: Engineering
      contact: engineering@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: denominator_not_zero_rate
      threshold: '0.99'
      severity: warning
    - dimension: accuracy
      rule: value_in_range_0_to_2
      severity: error
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: '%'
    data_quality: audited
    refresh_frequency: daily
- name: engineering_change_lead_time
  label: Lead Time de Mudança
  description: Tempo entre commit e implantação bem-sucedida em produção.
  type: derived
  type_params:
    expr: '# TODO translate: MEDIAN(hours_between(commit_at,production_at))'
  tags:
  - engineering
  meta:
    owners:
    - type: business
      team: Engineering
      contact: engineering@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: horas
    data_quality: audited
    refresh_frequency: daily
- name: engineering_change_volume
  label: Volume de Mudanças
  description: Número de mudanças de software implantadas no período.
  type: simple
  type_params:
    measure:
      name: change_volume
  tags:
  - engineering
  meta:
    owners:
    - type: business
      team: Engineering
      contact: engineering@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: null_rate
      threshold: '0.01'
      severity: warning
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: deployments
    data_quality: audited
    refresh_frequency: daily
