version: 2
metrics:
- name: data_completeness
  label: Completude
  description: Percentual de registros ou campos esperados que estão presentes.
  type: derived
  type_params:
    expr: '# TODO translate: present_values / NULLIF(expected_values,0)'
  tags:
  - data
  meta:
    owners:
    - type: business
      team: Data
      contact: data@empresa.com
    quality:
    - dimension: freshness
      rule: max_age_hours
      threshold: '26'
      severity: error
    - dimension: completeness
      rule: denominator_not_zero_rate
      threshold: '0.99'
      severity: warning
    - dimension: accuracy
      rule: value_in_range_0_to_2
      severity: error
    - dimension: consistency
      rule: cross_system_reconciliation
      threshold: '0.001'
      severity: error
    unit: '%'
    data_quality: audited
    refresh_frequency: daily
- name: data_data_contract_compliance
