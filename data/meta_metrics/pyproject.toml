[project]
name = "meta-metrics"
version = "0.1.0"
description = "Metrics by departament for semantic layer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
load-catalog  = "src.to_duckdb:main"
generate-dbt  = "src.to_dbt:main"
validate-catalog = "src.validate:main"
catalog-api   = "src.api:main"
